task:
  task_id: demo-hpo-001
  task_type: classification
  dataset_uri: examples/data/train.jsonl
  base_checkpoint_uri: artifacts/base/mock-model
  random_seed: 42

execution:
  mode: local
  max_retries: 3
  mock_behavior: completed

optimization:
  study_name: demo-hpo-001
  storage_key: OPTUNA_STORAGE_MAIN
  sampler: tpe
  direction: maximize
  objective: val_f1
  target_value: 0.99
  max_trials: 3
  max_duration_seconds: 3600
  patience: 6
  min_delta: 0.001
  search_space:
    learning_rate:
      type: float
      low: 1.0e-5
      high: 1.0e-3
      log: true
    weight_decay:
      type: float
      low: 0.0
      high: 0.1
    batch_size:
      type: categorical
      choices: [8, 16, 32]

training:
  epochs: 4
  precision: fp32
