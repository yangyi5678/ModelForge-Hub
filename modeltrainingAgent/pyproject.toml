[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "modeltrainingagent"
version = "0.1.0"
description = "Recoverable LangGraph and Optuna training orchestration agent with mock trainer."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langgraph>=0.2.60,<0.3.0",
  "langgraph-checkpoint-sqlite>=2.0.1,<3.0.0",
  "optuna>=4.1.0,<5.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "typer>=0.12.5,<1.0.0",
  "oss2>=2.18,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
  "mypy>=1.13.0,<2.0.0",
  "types-PyYAML>=6.0.12,<7.0.0",
]

[project.scripts]
training-agent = "training_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/training_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
